workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH =~ /^(dev|stg|main)$/

stages:
  - test
  - build
  - deploy-test

variables:
  IMAGE: "${CI_REGISTRY_IMAGE}"

# Test template - pulls credentials from target namespace secrets
.test:
  stage: test
  tags:
    - k8s
    - docker
  image: docker.io/astral/uv:python3.12-bookworm-slim
  before_script:
    # Install kubectl
    - apt-get update -qq && apt-get install -qq -y curl >/dev/null
    - curl -sLO "https://dl.k8s.io/release/v1.28.0/bin/linux/amd64/kubectl"
    - chmod +x kubectl && mv kubectl /usr/local/bin/
    - uv sync
  script:
    # Fetch config and secrets, then run tests in one shell to preserve env vars
    - |
      # From ConfigMap (non-sensitive)
      export REAR_DIFF_PGSQL_HOST=$(kubectl get configmap rear-diff-config -n ${NAMESPACE} -o jsonpath='{.data.REAR_DIFF_PGSQL_HOST}')
      export REAR_DIFF_PGSQL_PORT=$(kubectl get configmap rear-diff-config -n ${NAMESPACE} -o jsonpath='{.data.REAR_DIFF_PGSQL_PORT}')
      export REAR_DIFF_PGSQL_DATABASE=$(kubectl get configmap rear-diff-config -n ${NAMESPACE} -o jsonpath='{.data.REAR_DIFF_PGSQL_DATABASE}')
      # From Secret (sensitive)
      export REAR_DIFF_PGSQL_USERNAME=$(kubectl get secret rear-diff-secrets -n ${NAMESPACE} -o jsonpath='{.data.REAR_DIFF_PGSQL_USERNAME}' | base64 -d)
      export REAR_DIFF_PGSQL_PASSWORD=$(kubectl get secret rear-diff-secrets -n ${NAMESPACE} -o jsonpath='{.data.REAR_DIFF_PGSQL_PASSWORD}' | base64 -d)
      echo "Using DB: $REAR_DIFF_PGSQL_HOST:$REAR_DIFF_PGSQL_PORT/$REAR_DIFF_PGSQL_DATABASE"
      uv run pytest test/ -v --tb=short

# Test for MR targeting dev
test-dev:
  extends: .test
  variables:
    NAMESPACE: "media-dev"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev"

# Test for MR targeting stg
test-stg:
  extends: .test
  variables:
    NAMESPACE: "media-stg"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "stg"

# Test for MR targeting main
test-prod:
  extends: .test
  variables:
    NAMESPACE: "media-prod"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"

# Build stage - runs on push to dev/stg/main
build:
  stage: build
  tags:
    - k8s
    - docker
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}"
      --dockerfile "${CI_PROJECT_DIR}/dockerfile"
      --destination "${IMAGE}:${CI_COMMIT_REF_NAME}"
      --destination "${IMAGE}:sha-${CI_COMMIT_SHORT_SHA}"
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(dev|stg|main)$/

# Deploy-test template
.deploy-test:
  stage: deploy-test
  tags:
    - k8s
    - docker
  image: alpine/k8s:1.28.3
  needs:
    - build
  variables:
    SERVICE_PORT: "8000"
    API_BASE: "/rear-diff"
  before_script:
    - apk add --no-cache bash curl jq
  script:
    - echo "Restarting deployment to pull new image..."
    - kubectl rollout restart deployment/${DEPLOYMENT} -n ${NAMESPACE}

    - echo "Waiting for rollout to complete..."
    - kubectl rollout status deployment/${DEPLOYMENT} -n ${NAMESPACE} --timeout=180s

    - echo "Waiting for pod to be ready..."
    - |
      SERVICE_URL="http://${SERVICE_HOST}:${SERVICE_PORT}"
      for i in $(seq 1 30); do
        HEALTH=$(curl -s -o /dev/null -w "%{http_code}" "${SERVICE_URL}${API_BASE}/health" || echo "000")
        if [ "$HEALTH" = "200" ]; then
          echo "Health check passed!"
          break
        fi
        echo "Health check attempt $i: HTTP $HEALTH, waiting..."
        sleep 5
      done
      if [ "$HEALTH" != "200" ]; then
        echo "Health check failed after 30 attempts"
        exit 1
      fi

    - echo "Testing API endpoints..."
    - |
      # Test training endpoint
      RESP=$(curl -sL -w "\n%{http_code}" "${SERVICE_URL}${API_BASE}/training?limit=1")
      CODE=$(echo "$RESP" | tail -1)
      if [ "$CODE" != "200" ]; then
        echo "Training endpoint failed: HTTP $CODE"
        exit 1
      fi
      echo "Training endpoint: OK"

      # Test media endpoint
      RESP=$(curl -sL -w "\n%{http_code}" "${SERVICE_URL}${API_BASE}/media?limit=1")
      CODE=$(echo "$RESP" | tail -1)
      if [ "$CODE" != "200" ]; then
        echo "Media endpoint failed: HTTP $CODE"
        exit 1
      fi
      echo "Media endpoint: OK"

      # Test prediction endpoint
      RESP=$(curl -sL -w "\n%{http_code}" "${SERVICE_URL}${API_BASE}/prediction?limit=1")
      CODE=$(echo "$RESP" | tail -1)
      if [ "$CODE" != "200" ]; then
        echo "Prediction endpoint failed: HTTP $CODE"
        exit 1
      fi
      echo "Prediction endpoint: OK"

      # Test movies endpoint
      RESP=$(curl -sL -w "\n%{http_code}" "${SERVICE_URL}${API_BASE}/movies?limit=1")
      CODE=$(echo "$RESP" | tail -1)
      if [ "$CODE" != "200" ]; then
        echo "Movies endpoint failed: HTTP $CODE"
        exit 1
      fi
      echo "Movies endpoint: OK"

      # Test flyway endpoint
      RESP=$(curl -sL -w "\n%{http_code}" "${SERVICE_URL}${API_BASE}/flyway")
      CODE=$(echo "$RESP" | tail -1)
      if [ "$CODE" != "200" ]; then
        echo "Flyway endpoint failed: HTTP $CODE"
        exit 1
      fi
      echo "Flyway endpoint: OK"

      echo "All endpoint tests passed!"

# Deploy-test for dev
deploy-test-dev:
  extends: .deploy-test
  resource_group: rear-diff-dev
  variables:
    DEPLOYMENT: "rear-diff-dev"
    NAMESPACE: "media-dev"
    SERVICE_HOST: "rear-diff-dev.media-dev.svc.cluster.local"
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

# Deploy-test for stg
deploy-test-stg:
  extends: .deploy-test
  resource_group: rear-diff-stg
  variables:
    DEPLOYMENT: "rear-diff-stg"
    NAMESPACE: "media-stg"
    SERVICE_HOST: "rear-diff-stg.media-stg.svc.cluster.local"
  rules:
    - if: $CI_COMMIT_BRANCH == "stg"

# Deploy-test for prod
deploy-test-prod:
  extends: .deploy-test
  resource_group: rear-diff-prod
  variables:
    DEPLOYMENT: "rear-diff-prod"
    NAMESPACE: "media-prod"
    SERVICE_HOST: "rear-diff-prod.media-prod.svc.cluster.local"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
